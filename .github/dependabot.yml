# Weekly grouped updates, 7 days after a release (like min-release-age in .npmrc).
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      composer: { patterns: ['*'], update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      npm: { patterns: ['*'], update-types: [minor, patch] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ['*'] }
