name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release and upload the zip

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm install --global npm@11
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: composer lint
      - run: npm run build:zip

      - run: gh release create "$GITHUB_REF_NAME" build/*.zip --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
